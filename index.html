<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Botanika</title><style>html,body{margin:0;min-height:100%;background:#f6f6f6;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#121415}.loading div{text-align:center}.spinner{width:28px;height:28px;border:3px solid #dfdfdf;border-top-color:#121415;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="loading"><div><div class="spinner"></div>Carregando Central…</div></div><script>(async()=>{const urls=Array.from({length:7},(_,i)=>`./chunk${i}.txt`);const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`Falha ${r.status} em ${u}`);return r.text()}));const b=parts.join('').replace(/\s+/g,'');if(b.length%4!==0)throw new Error('Base64 incompleto: '+b.length);const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()})().catch(e=>{document.body.innerHTML='<div style="font-family:Arial,sans-serif;padding:40px;color:#121415"><h2>Não foi possível carregar a Central</h2><p>'+String(e)+'</p></div>'});</script></body></html>
