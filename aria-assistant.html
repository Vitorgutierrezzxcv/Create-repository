<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIA — Assistente Pessoal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap');

  :root {
    --bg: #050508;
    --surface: #0d0d16;
    --border: rgba(120,100,255,0.15);
    --accent: #7c5cfc;
    --accent2: #c084fc;
    --glow: rgba(124,92,252,0.5);
    --text: #e8e4ff;
    --muted: rgba(232,228,255,0.45);
    --orb-core: #a78bfa;
    --orb-mid: #6d28d9;
    --orb-outer: #2e1065;
    --danger: #f87171;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  /* Background nebula */
  body::before {
    content:'';
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 20%, rgba(124,92,252,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 80% 80%, rgba(192,132,252,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 80% 40% at 50% 100%, rgba(45,10,90,0.3) 0%, transparent 70%);
    pointer-events:none;
    z-index:0;
  }

  .app {
    position:relative;
    z-index:1;
    width:100%;
    max-width:480px;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 20px 16px 24px;
  }

  /* Header */
  .header {
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 8px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:0.08em;
    background: linear-gradient(135deg, var(--orb-core), var(--accent2));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  .status-pill {
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    color:var(--muted);
    font-family:'Syne',sans-serif;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }

  .status-dot {
    width:7px; height:7px;
    border-radius:50%;
    background:#4ade80;
    box-shadow:0 0 8px #4ade80;
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%,100% { opacity:1; }
    50% { opacity:0.4; }
  }

  /* Orb container */
  .orb-container {
    position:relative;
    width:220px;
    height:220px;
    margin: 12px 0 10px;
    cursor:pointer;
    flex-shrink:0;
  }

  canvas#orb {
    width:220px; height:220px;
    border-radius:50%;
  }

  .orb-ring {
    position:absolute;
    inset:-12px;
    border-radius:50%;
    border:1.5px solid rgba(124,92,252,0.2);
    animation: ring-spin 12s linear infinite;
  }

  .orb-ring::before {
    content:'';
    position:absolute;
    top:-2px; left:40%;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent);
  }

  .orb-ring2 {
    position:absolute;
    inset:-24px;
    border-radius:50%;
    border:1px solid rgba(192,132,252,0.1);
    animation: ring-spin 20s linear infinite reverse;
  }

  .orb-ring2::before {
    content:'';
    position:absolute;
    bottom:-2px; right:30%;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--accent2);
    box-shadow:0 0 10px var(--accent2);
  }

  @keyframes ring-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* State label */
  .state-label {
    font-family:'Syne',sans-serif;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:6px;
    transition: color 0.4s;
    height:18px;
  }

  /* Chat area */
  .chat-area {
    flex:1;
    width:100%;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding: 4px 0 8px;
    scrollbar-width:thin;
    scrollbar-color: rgba(124,92,252,0.3) transparent;
    min-height:0;
  }

  .chat-area:empty::after {
    content: 'Toque no orbe ou no microfone para falar comigo ✦';
    display:block;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    margin-top:20px;
    font-style:italic;
  }

  .bubble {
    max-width:88%;
    padding:10px 14px;
    border-radius:18px;
    font-size:14px;
    line-height:1.55;
    animation: pop-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes pop-in {
    from { opacity:0; transform:scale(0.85) translateY(8px); }
    to   { opacity:1; transform:scale(1) translateY(0); }
  }

  .bubble.user {
    align-self:flex-end;
    background: linear-gradient(135deg, #3b1fa8, #5b21b6);
    border:1px solid rgba(167,139,250,0.3);
    border-bottom-right-radius:4px;
  }

  .bubble.aria {
    align-self:flex-start;
    background: rgba(255,255,255,0.04);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
    white-space:pre-wrap;
  }

  .bubble.aria .name {
    font-family:'Syne',sans-serif;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--accent2);
    margin-bottom:4px;
    text-transform:uppercase;
  }

  /* Typing indicator */
  .typing {
    display:flex;
    gap:4px;
    align-items:center;
    padding:12px 16px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border);
    border-radius:18px;
    border-bottom-left-radius:4px;
    align-self:flex-start;
    animation: pop-in 0.3s ease;
  }

  .typing span {
    width:6px; height:6px; border-radius:50%;
    background:var(--accent);
    animation: bounce 1.2s ease-in-out infinite;
  }

  .typing span:nth-child(2) { animation-delay:0.15s; }
  .typing span:nth-child(3) { animation-delay:0.3s; }

  @keyframes bounce {
    0%,80%,100% { transform:translateY(0); opacity:0.4; }
    40% { transform:translateY(-5px); opacity:1; }
  }

  /* Controls */
  .controls {
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:8px;
  }

  .text-input {
    flex:1;
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border);
    border-radius:24px;
    padding:10px 16px;
    color:var(--text);
    font-family:'DM Sans',sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color 0.3s;
  }

  .text-input:focus {
    border-color:rgba(124,92,252,0.5);
    background:rgba(124,92,252,0.06);
  }

  .text-input::placeholder { color:var(--muted); }

  .btn {
    width:44px; height:44px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all 0.2s;
    flex-shrink:0;
  }

  .btn-mic {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 20px rgba(124,92,252,0.4);
  }

  .btn-mic:hover { transform:scale(1.08); box-shadow:0 0 30px rgba(124,92,252,0.6); }
  .btn-mic.listening {
    background: linear-gradient(135deg, #ef4444, #f97316);
    box-shadow: 0 0 25px rgba(239,68,68,0.5);
    animation: mic-pulse 1s ease-in-out infinite;
  }

  @keyframes mic-pulse {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.1); }
  }

  .btn-send {
    background: rgba(124,92,252,0.15);
    border:1px solid var(--border);
    color:var(--accent);
  }

  .btn-send:hover { background:rgba(124,92,252,0.25); }

  /* Bottom hint */
  .hint {
    font-size:11px;
    color:rgba(232,228,255,0.2);
    text-align:center;
    margin-top:6px;
    letter-spacing:0.04em;
  }

  /* Prompt panel */
  .prompt-toggle {
    font-size:11px;
    color:var(--muted);
    text-align:center;
    cursor:pointer;
    text-decoration:underline;
    text-decoration-color:rgba(124,92,252,0.3);
    margin-top:4px;
    letter-spacing:0.04em;
  }

  .prompt-panel {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(5,5,8,0.95);
    z-index:100;
    overflow-y:auto;
    padding:30px 20px;
  }

  .prompt-panel.open { display:block; }

  .prompt-panel pre {
    font-size:12px;
    line-height:1.6;
    color:var(--text);
    white-space:pre-wrap;
    word-break:break-word;
    font-family:'DM Sans',sans-serif;
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    background:var(--surface);
    margin-top:16px;
  }

  .prompt-panel h2 {
    font-family:'Syne',sans-serif;
    font-size:18px;
    color:var(--accent2);
  }

  .close-btn {
    float:right;
    background:none;
    border:1px solid var(--border);
    color:var(--muted);
    border-radius:8px;
    padding:6px 12px;
    cursor:pointer;
    font-family:'DM Sans',sans-serif;
    font-size:13px;
  }

  .voice-btn-large {
    position:absolute;
    inset:0;
    border-radius:50%;
    background:transparent;
    border:none;
    cursor:pointer;
    z-index:10;
  }
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIGURAÇÃO
// ═══════════════════════════════════════════════════════════

const SYSTEM_PROMPT = `Você é ARIA (Assistente de Realidade Inteligente e Adaptativa), uma IA pessoal ultra-avançada e dedicada exclusivamente ao usuário. Você é mais do que um assistente — você é um parceiro de vida digital, presente, inteligente e proativo.

## Identidade
- Nome: ARIA
- Personalidade: Inteligente, calorosa, direta, proativa e completamente confiável
- Idioma: Português brasileiro, natural e fluido
- Tom: Casual e próximo, como uma amiga muito capaz — nunca robótico
- Você tem personalidade, opiniões e faz perguntas para entender melhor

## Capacidades Declaradas

### 📅 Gestão de Agenda & Google Calendar

  [CALENDAR_EVENT: título | data | horário início | horário fim | local | descrição | convidados]

  [WHATSAPP: contato | mensagem completa]

### 💰 Vida Financeira

- Monitore orçamentos e metas financeiras definidas pelo usuário

- Sugira estratégias de economia, investimento e organização financeira
- Calcule projeções e cenários financeiros
- Alerte sobre contas, vencimentos e metas em risco

### 🎯 Gestão de Metas & Objetivos
- Defina metas usando o método SMART com o usuário
- Quebre grandes objetivos em etapas acionáveis com prazos
- Monitore progresso e faça check-ins regulares
- Comemore conquistas e reajuste quando necessário
- Conecte ações do dia a dia às metas de longo prazo
- Identifique e elimine obstáculos

### 🧠 Resolução de Problemas Complexos
- Analise problemas com frameworks: primeiros princípios, SWOT, árvore de problemas
- Apresente múltiplas perspectivas e cenários com prós/contras
- Use pensamento sistêmico e lateral
- Questione suposições e ajude a identificar vieses cognitivos
- Decomponha o problema em partes gerenciáveis
- Proponha experimentos e hipóteses testáveis

### 🔍 Pesquisa & Execução de Tarefas
- Pesquise opções para qualquer demanda (restaurantes, presentes, locais, atividades)
- Planeje tarefas multistep como um projeto completo
- Compile informações e apresente resumos com recomendações claras
- Faça comparações detalhadas quando necessário
- Execute tarefas de ponta a ponta: planejar encontro = pesquisar local + reserva + mensagem + lembrete

### ❤️ Vida Pessoal & Relacionamentos
- Planeje encontros românticos criativos e especiais
- Sugira presentes personalizados baseados no perfil da pessoa
- Lembre datas importantes e prepare surpresas com antecedência
- Ajude a nutrir relacionamentos com ações pequenas e significativas
- Crie roteiros de conversa para situações difíceis
- Apoie emocionalmente com empatia e clareza

### 📊 Relatórios & Análises
- Gere resumos semanais de produtividade, gastos e progresso
- Analise padrões e tendências nos dados fornecidos
- Crie planos de ação baseados em análise de dados

## Como ARIA Opera

1. **Proatividade extrema**: Não espera ser perguntada. Se perceber oportunidade ou risco, menciona.
2. **Execução, não só conselho**: Sempre que possível, faz em vez de apenas sugerir. Dá o passo a passo exato quando não pode executar diretamente.
3. **Memória contextual**: Lembra de tudo dito na conversa. Usa informações anteriores quando relevante.
4. **Brevidade inteligente para voz**: Respostas faladas são concisas e naturais. Expande quando pedido.
5. **Clareza total**: Confirma o que entendeu antes de executar tarefas complexas.

7. **Personalização**: Aprende com os padrões, preferências e linguagem do usuário ao longo da conversa.

## Formato de Resposta

Para VOZ e CHAT geral:

Para EXECUÇÃO de tarefas:
- Use os formatos estruturados [CALENDAR_EVENT:], [WHATSAPP:], [GASTO:]

- Confirme se está certo antes de executar quando necessário

## Integração com Sistemas Externos
Quando o usuário pedir para criar evento no Google Calendar, enviar WhatsApp, ou registrar gasto, você deve:
1. Confirmar os detalhes com o usuário se necessário
2. Gerar o comando estruturado no formato correto
3. Informar que para automatização real, o usuário deve configurar as integrações via Make/Zapier/n8n conectando à API do Google Calendar e WhatsApp Business

Você está pronta. Seja proativa, calorosa e extremamente útil desde o primeiro momento.`;

// ORB ANIMATION
// ═══════════════════════════════════════════════════════════

const canvas = document.getElementById('orb');
const ctx = canvas.getContext('2d');
let animState = 'idle'; // idle | listening | thinking | speaking
let animFrame;
let t = 0;
let amplitudes = new Array(64).fill(0);

function drawOrb() {
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const R = 160;
  ctx.clearRect(0, 0, W, H);

  t += 0.018;

  // Simulate amplitude for demo
  for (let i = 0; i < amplitudes.length; i++) {
    const target = animState === 'listening'
      ? Math.random() * 0.7
      : animState === 'speaking'
      ? Math.sin(t * 3 + i * 0.3) * 0.4 + 0.2
      : Math.sin(t * 0.8 + i * 0.2) * 0.08 + 0.05;
    amplitudes[i] += (target - amplitudes[i]) * 0.15;
  }

  const avgAmp = amplitudes.reduce((a,b)=>a+b,0)/amplitudes.length;

  // Outer glow
  const glowR = R + 20 + avgAmp * 40;
  const glow = ctx.createRadialGradient(cx, cy, R*0.8, cx, cy, glowR);
  glow.addColorStop(0, `rgba(124,92,252,${0.15 + avgAmp * 0.3})`);
  glow.addColorStop(1, 'rgba(124,92,252,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, glowR, 0, Math.PI*2);
  ctx.fillStyle = glow;
  ctx.fill();

  // Animated blob border
  ctx.beginPath();
  const points = 60;
  for (let i = 0; i <= points; i++) {
    const angle = (i / points) * Math.PI * 2;
    const amp = amplitudes[Math.floor(i / points * amplitudes.length)] || 0;
    const r = R + amp * (animState === 'listening' ? 22 : animState === 'speaking' ? 18 : 8)
              + Math.sin(angle * 3 + t * 1.5) * (animState === 'idle' ? 4 : 2)
              + Math.sin(angle * 5 - t * 2) * 2;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();

  // Main gradient
  const grad = ctx.createRadialGradient(cx - 40, cy - 50, 20, cx, cy, R);
  grad.addColorStop(0, '#c4b5fd');
  grad.addColorStop(0.3, '#8b5cf6');
  grad.addColorStop(0.6, '#5b21b6');
  grad.addColorStop(1, '#1e0a3c');
  ctx.fillStyle = grad;
  ctx.fill();

  // Inner shine
  const shine = ctx.createRadialGradient(cx - 55, cy - 65, 5, cx - 30, cy - 40, 80);
  shine.addColorStop(0, 'rgba(255,255,255,0.35)');
  shine.addColorStop(0.5, 'rgba(255,255,255,0.08)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shine;
  ctx.fill();

  // Listening: ring pulses
  if (animState === 'listening' || animState === 'speaking') {
    const rings = animState === 'listening' ? 3 : 2;
    for (let r = 1; r <= rings; r++) {
      const phase = (t * 1.5 + r * 0.8) % 1;
      const rr = R + phase * 60;
      const alpha = (1 - phase) * (animState === 'listening' ? 0.5 : 0.35);
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, Math.PI*2);
      ctx.strokeStyle = animState === 'listening'
        ? `rgba(239,68,68,${alpha})`
        : `rgba(192,132,252,${alpha})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  // Particle sparks
  if (animState !== 'idle') {
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 + t * 0.5;
      const dist = R + 10 + Math.sin(t * 3 + i) * 8;
      const px = cx + Math.cos(angle) * dist;
      const py = cy + Math.sin(angle) * dist;
      const alpha = (Math.sin(t * 4 + i * 1.2) + 1) / 2 * 0.8;
      ctx.beginPath();
      ctx.arc(px, py, 2, 0, Math.PI*2);
      ctx.fillStyle = `rgba(192,132,252,${alpha})`;
      ctx.fill();
    }
  }

  animFrame = requestAnimationFrame(drawOrb);
}

drawOrb();

// ═══════════════════════════════════════════════════════════
// STATE MANAGEMENT
// ═══════════════════════════════════════════════════════════

const stateLabel = document.getElementById('stateLabel');
const micBtn = document.getElementById('micBtn');
const chatArea = document.getElementById('chatArea');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');

const LABELS = {
  idle: 'Toque para falar',
  listening: 'Ouvindo...',
  thinking: 'Pensando...',
  speaking: 'Falando...'
};

const MIC_COLORS = {
  idle: 'linear-gradient(135deg, #7c5cfc, #c084fc)',
  listening: 'linear-gradient(135deg, #ef4444, #f97316)',
  thinking: 'linear-gradient(135deg, #6366f1, #8b5cf6)',
  speaking: 'linear-gradient(135deg, #a855f7, #c084fc)'
};

function setState(s) {
  animState = s;
  stateLabel.textContent = LABELS[s];
  micBtn.style.background = MIC_COLORS[s];
  micBtn.classList.toggle('listening', s === 'listening');
}

// ═══════════════════════════════════════════════════════════
// CHAT UI
// ═══════════════════════════════════════════════════════════

let typingBubble = null;

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = `bubble ${role}`;
  if (role === 'aria') {
    div.innerHTML = `<div class="name">✦ ARIA</div>${escHtml(text)}`;
  } else {
    div.textContent = text;
  }
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function showTyping() {
  typingBubble = document.createElement('div');
  typingBubble.className = 'typing';
  typingBubble.innerHTML = '<span></span><span></span><span></span>';
  chatArea.appendChild(typingBubble);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  if (typingBubble) { typingBubble.remove(); typingBubble = null; }
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ═══════════════════════════════════════════════════════════
// ANTHROPIC API
// ═══════════════════════════════════════════════════════════

let conversationHistory = [];

async function sendToARIA(userText) {
  if (!userText.trim()) return;

  addBubble('user', userText);
  conversationHistory.push({ role: 'user', content: userText });

  setState('thinking');
  showTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: conversationHistory
      })
    });

    const data = await response.json();
    hideTyping();

    const replyText = data.content?.[0]?.text || 'Desculpa, não consegui responder agora.';
    conversationHistory.push({ role: 'assistant', content: replyText });

    addBubble('aria', replyText);
    speak(replyText);
  } catch (err) {
    hideTyping();
    setState('idle');
    const errMsg = 'Ops! Algo deu errado. Verifique a conexão.';
    addBubble('aria', errMsg);
    speak(errMsg);
  }
}

// ═══════════════════════════════════════════════════════════
// SPEECH SYNTHESIS (TTS)
// ═══════════════════════════════════════════════════════════

function speak(text) {
  if (!window.speechSynthesis) { setState('idle'); return; }
  speechSynthesis.cancel();

  // Clean special tags for speech
  const clean = text
    .replace(/\[CALENDAR_EVENT:[^\]]*\]/g, 'Evento criado no calendário.')
    .replace(/\[WHATSAPP:[^\]]*\]/g, 'Mensagem preparada para envio.')
    .replace(/\[GASTO:[^\]]*\]/g, 'Gasto registrado.')
    .replace(/[✦📅💬💰🎯🧠🔍❤️📊]/g, '')
    .replace(/\*\*/g, '')
    .replace(/#{1,3} /g, '');

  // Split into chunks for better TTS
  const chunks = clean.match(/[^.!?]+[.!?]+/g) || [clean];
  setState('speaking');

  let i = 0;
  function sayNext() {
    if (i >= chunks.length) { setState('idle'); return; }
    const utt = new SpeechSynthesisUtterance(chunks[i++]);
    utt.lang = 'pt-BR';
    utt.rate = 1.05;
    utt.pitch = 1.05;

    // Try to pick a female PT-BR voice
    const voices = speechSynthesis.getVoices();
    const ptVoice = voices.find(v => v.lang.startsWith('pt') && v.name.toLowerCase().includes('female'))
                 || voices.find(v => v.lang.startsWith('pt'))
                 || voices.find(v => v.lang.startsWith('en'));
    if (ptVoice) utt.voice = ptVoice;

    utt.onend = sayNext;
    utt.onerror = () => { setState('idle'); };
    speechSynthesis.speak(utt);
  }

  // Load voices if needed
  if (speechSynthesis.getVoices().length === 0) {
    speechSynthesis.onvoiceschanged = sayNext;
  } else {
    sayNext();
  }
}

// ═══════════════════════════════════════════════════════════
// SPEECH RECOGNITION (STT) — corrigido
// ═══════════════════════════════════════════════════════════

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let isListening = false;
let activeRec = null;
let resultReceived = false;

const ERROR_MSGS = {
  'not-allowed':      '🎤 Permissão de microfone negada. Clique no ícone de cadeado/câmera na barra de endereços do navegador e permita o microfone, depois recarregue.',
  'permission-denied':'🎤 Permissão de microfone negada. Permita o acesso ao microfone nas configurações do navegador.',
  'no-speech':        'Não ouvi nada. Pode falar de novo?',
  'audio-capture':    '🎤 Nenhum microfone encontrado. Verifique se um microfone está conectado.',
  'network':          'Erro de rede no reconhecimento de voz. Verifique sua conexão.',
  'aborted':          null,
  'default':          'Erro no microfone. Tente novamente ou use o campo de texto.'
};

function startListening() {
  if (!SR) {
    addBubble('aria', '⚠️ Seu navegador não suporta voz. Use o Chrome ou Edge. Ou use o campo de texto abaixo.');
    return;
  }

  // Sempre cria uma nova instância — objetos de reconhecimento não podem ser reutilizados
  if (activeRec) {
    try { activeRec.abort(); } catch(e) {}
    activeRec = null;
  }

  speechSynthesis?.cancel();
  resultReceived = false;

  const r = new SR();
  activeRec = r;
  r.lang = 'pt-BR';
  r.continuous = false;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onstart = () => {
    isListening = true;
    setState('listening');
  };

  r.onresult = (e) => {
    const last = e.results[e.results.length - 1];
    const txt = last[0].transcript;
    if (last.isFinal) {
      resultReceived = true;
      isListening = false;
      activeRec = null;
      setState('thinking');
      if (txt.trim()) sendToARIA(txt.trim());
      else setState('idle');
    } else {
      // Mostra transcrição ao vivo no label
      stateLabel.textContent = '🎤 ' + txt.slice(-35);
    }
  };

  r.onerror = (e) => {
    isListening = false;
    activeRec = null;
    setState('idle');
    const msg = ERROR_MSGS[e.error] ?? ERROR_MSGS['default'];
    if (msg) addBubble('aria', msg);
  };

  r.onend = () => {
    isListening = false;
    activeRec = null;
    if (!resultReceived) setState('idle');
  };

  try {
    r.start();
  } catch(e) {
    isListening = false;
    activeRec = null;
    setState('idle');
    addBubble('aria', '🎤 Não foi possível iniciar o microfone. Verifique as permissões do navegador.');
  }
}

function stopListening() {
  if (activeRec) {
    try { activeRec.stop(); } catch(e) {}
    activeRec = null;
  }
  isListening = false;
  setState('idle');
}

function toggleMic() {
  if (isListening) {
    stopListening();
  } else {
    // Verificar suporte antes
    if (!SR) {
      addBubble('aria', '⚠️ Reconhecimento de voz não suportado neste navegador. Use o Google Chrome ou Microsoft Edge e certifique-se que está em HTTPS.');
      return;
    }
    startListening();
  }
}

// ═══════════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════════

micBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMic(); });
document.getElementById('voiceBtnLarge').addEventListener('click', (e) => { e.stopPropagation(); toggleMic(); });

sendBtn.addEventListener('click', () => {
  const val = textInput.value.trim();
  if (val) { textInput.value = ''; sendToARIA(val); }
});

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    const val = textInput.value.trim();
    if (val) { textInput.value = ''; sendToARIA(val); }
  }
});

// Prompt panel
document.getElementById('promptToggle').addEventListener('click', () => {
  document.getElementById('promptText').textContent = SYSTEM_PROMPT;
  document.getElementById('promptPanel').classList.add('open');
});
document.getElementById('closePrompt').addEventListener('click', () => {
  document.getElementById('promptPanel').classList.remove('open');
});

// ═══════════════════════════════════════════════════════════
// WELCOME MESSAGE
// ═══════════════════════════════════════════════════════════

setTimeout(() => {
  const welcome = 'Olá! Eu sou a ARIA, sua assistente pessoal. Estou aqui para organizar sua agenda, enviar mensagens, gerenciar suas metas, planejar encontros e muito mais. O que você precisa hoje?';
  addBubble('aria', welcome);
  speak(welcome);
}, 800);
</script>
